services:
  - type: web
    name: reviewguard-ai
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/run_server.py"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONPATH
        value: ./backend
