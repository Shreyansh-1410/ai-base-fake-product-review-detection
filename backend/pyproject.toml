[project]
name = "reviewguard-backend"
version = "1.0.0"
description = "AI-Based Fake Product Review Detection System Backend"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "gunicorn>=22.0.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "nltk>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "pymongo>=4.8.0",
    "mongomock>=4.1.2",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "joblib>=1.4.0",
    "xgboost>=2.1.0; platform_system == 'Windows'",
    "xgboost-cpu>=2.1.0; platform_system != 'Windows'",
]

[tool.vercel]
entrypoint = "main:app"
